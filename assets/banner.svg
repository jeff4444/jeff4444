<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404" role="img" aria-labelledby="t d">
  <title id="t">Jeff Mofor Allo — waveform viewer</title>
  <desc id="d">A timing diagram of Jeff's path: NVIDIA internships in 2024 and 2025, then full-time at NVIDIA from August 2026; IEEE Howard president from 2025 until graduating in May 2026; and the trace signal high since December 2025, when Jeff co-founded Trace.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .clk { animation: clk 0.9s linear infinite; }
    @keyframes clk { to { transform: translateX(-20px); } }
    .blink { animation: blink 1.2s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .curtain { animation: reveal 2.6s steps(84) 0.5s forwards; }
    @keyframes reveal { to { transform: translateX(672px); } }
    .caret { animation: caret 2.6s steps(84) 0.5s forwards, blink 1s step-end 3.1s infinite; }
    @keyframes caret { to { transform: translateX(668px); } }
    .cursor { animation: sweep 2.4s cubic-bezier(.2,.8,.2,1) 0.3s both; }
    @keyframes sweep { from { transform: translateX(-679.0px); } to { transform: translateX(0); } }
    .glow { animation: glow 2.8s ease-in-out infinite; }
    @keyframes glow { 50% { fill-opacity: 0.22; } }
    @media (prefers-reduced-motion: reduce) {
      .clk, .blink, .glow { animation: none; }
      .curtain { animation: none; transform: translateX(672px); }
      .caret { animation: none; transform: translateX(668px); }
      .cursor { animation: none; }
    }
  </style>
